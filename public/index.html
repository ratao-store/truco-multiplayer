<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truco Paulista Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN / CRIAR SALA -->
  <div id="login-container">
    <div class="card-login">
      <h2>Truco Paulista</h2>
      
      <div class="form-group">
        <label>Seu Apelido:</label>
        <input type="text" id="input-apelido" placeholder="Ex: Rato123">
      </div>

      <div class="form-group">
        <label>Nome da Sala:</label>
        <input type="text" id="input-sala" placeholder="Ex: sala-dos-amigos">
      </div>

      <div class="form-group">
        <label>Jogadores na Sala:</label>
        <select id="select-jogadores">
          <option value="2">2 Jogadores (1 vs 1)</option>
          <option value="4" selected>4 Jogadores (2 vs 2)</option>
        </select>
      </div>

      <button id="btn-entrar" class="btn-primary">Entrar / Criar Sala</button>
    </div>
  </div>

  <!-- TELA DO JOGO (ESCONDIDA DE INÍCIO) -->
  <div id="app" style="display: none;">
    <header>
      <div class="info-sala">Sala: <span id="label-nome-sala"></span></div>
      <div class="placar">
        <div class="time time-a">
          <div id="nome-time-a" class="nomes">Time A</div>
          <div id="pontos-a" class="pts">0</div>
        </div>
        <div class="vs">VS</div>
        <div class="time time-b">
          <div id="nome-time-b" class="nomes">Time B</div>
          <div id="pontos-b" class="pts">0</div>
        </div>
      </div>
      <div id="status-vez" class="status">Aguardando...</div>
    </header>

    <main>
      <div class="mesa">
        <div class="area-vira">
          <p>VIRA</p>
          <div id="carta-vira" class="carta vira">?</div>
        </div>
        <div class="area-jogadas">
          <p>Mesa</p>
          <div id="cartas-mesa" class="cartas-container"></div>
        </div>
      </div>
    </main>

    <footer>
      <p id="meu-info">Conectando...</p>
      <div id="minhas-cartas" class="cartas-container"></div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
