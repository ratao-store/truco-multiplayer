<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truco Paulista Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="placar">
        <div class="time">
          <span id="nome-time-a">Time A</span>
          <span id="pontos-a" class="pts">0</span>
        </div>
        <div class="vs">VS</div>
        <div class="time">
          <span id="nome-time-b">Time B</span>
          <span id="pontos-b" class="pts">0</span>
        </div>
      </div>
      <div id="status-vez" class="status">Aguardando jogadores...</div>
    </header>

    <main>
      <div class="mesa">
        <div class="area-vira">
          <p>VIRA</p>
          <div id="carta-vira" class="carta vira">?</div>
        </div>
        <div class="area-jogadas">
          <p>Mesa</p>
          <div id="cartas-mesa" class="cartas-container"></div>
        </div>
      </div>
    </main>

    <footer>
      <p id="meu-info">Conectando...</p>
      <div id="minhas-cartas" class="cartas-container"></div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
