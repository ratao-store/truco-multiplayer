<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truco Vargem do Salto Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- EFEITO ZAP / IMPACTO TELA QUEBRADA -->
  <div id="overlay-zap" class="overlay-zap" style="display: none;">
    <div class="vidro-quebrado"></div>
    <div class="container-zap-animado">
      <h1 id="texto-efeito-zap">ZAP!</h1>
      <div id="carta-zap-grande" class="carta-grande">♣</div>
    </div>
  </div>

  <!-- TELA PRINCIPAL (LOGIN / ENTRAR NA SALA) -->
  <div id="login-container">
    <div class="card-login" id="card-entrar">
      <h2>Truco Vargem do Salto</h2>
      
      <div class="form-group">
        <label>Seu Apelido:</label>
        <input type="text" id="input-apelido" placeholder="">
      </div>

      <div class="form-group">
        <label>Nome da Sala:</label>
        <input type="text" id="input-sala" placeholder="Ex: sala-dos-amigos">
      </div>

      <button id="btn-entrar" class="btn-primary">Entrar na Sala</button>
      <button id="btn-abrir-criar" class="btn-secondary">Ou Criar uma Nova Sala</button>
    </div>

    <!-- PAINEL SEPARADO PARA CRIAR SALA -->
    <div class="card-login" id="card-criar" style="display: none;">
      <h2>Criar Nova Sala</h2>
      
      <div class="form-group">
        <label>Seu Apelido:</label>
        <input type="text" id="input-criar-apelido" placeholder="">
      </div>

      <div class="form-group">
        <label>Nome da Nova Sala:</label>
        <input type="text" id="input-criar-sala" placeholder="Ex: sala-vip">
      </div>

      <div class="form-group">
        <label>Quantidade de Jogadores:</label>
        <select id="select-max-jogadores">
          <option value="2">2 Jogadores (1 vs 1)</option>
          <option value="4" selected>4 Jogadores (2 vs 2)</option>
        </select>
      </div>

      <button id="btn-confirmar-criar" class="btn-primary">Criar e Entrar</button>
      <button id="btn-voltar-entrar" class="btn-secondary">Voltar</button>
    </div>
  </div>

  <!-- TELA DE JOGO -->
  <div id="app" style="display: none;">
    <header>
      <div class="info-sala">
        Sala: <span id="label-nome-sala"></span> | Valendo: <span id="label-valor-mao" class="destaque">1</span> Pt(s)
      </div>
      <div class="placar">
        <div class="time time-a">
          <div id="trofeus-a" class="trofeus">🏆 0</div>
          <div id="nome-time-a" class="nomes">Time A</div>
          <div id="pontos-a" class="pts">0</div>
          <div class="bolinhas-rodada" id="bolinhas-a">
            <span class="bolinha"></span>
            <span class="bolinha"></span>
            <span class="bolinha"></span>
          </div>
        </div>

        <div class="vs">VS</div>

        <div class="time time-b">
          <div id="trofeus-b" class="trofeus">🏆 0</div>
          <div id="nome-time-b" class="nomes">Time B</div>
          <div id="pontos-b" class="pts">0</div>
          <div class="bolinhas-rodada" id="bolinhas-b">
            <span class="bolinha"></span>
            <span class="bolinha"></span>
            <span class="bolinha"></span>
          </div>
        </div>
      </div>
      <div id="status-vez" class="status">Aguardando...</div>
    </header>

    <main>
      <div class="mesa">
        <div class="area-vira">
          <p>VIRA</p>
          <div id="carta-vira" class="carta vira">?</div>
        </div>
        <div class="area-jogadas">
          <p>Mesa</p>
          <div id="cartas-mesa" class="cartas-container"></div>
        </div>
      </div>
    </main>

    <footer>
      <!-- POPUP / MENU DO TRUCO -->
      <div id="modal-truco" class="modal-truco" style="display: none;">
        <p id="texto-truco-pedido">Alguém pediu Truco!</p>
        <div class="botoes-truco">
          <button id="btn-aceitar-truco" class="btn-aceitar">Aceitar</button>
          <button id="btn-aumentar-truco" class="btn-aumentar">Aumentar</button>
          <button id="btn-correr-truco" class="btn-correr">Correr (Fugir)</button>
        </div>
      </div>

      <div class="controles-jogador">
        <button id="btn-pedir-truco" class="btn-truco-action">TRUCO!</button>
      </div>

      <p id="meu-info">Conectando...</p>
      <div id="minhas-cartas" class="cartas-container"></div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
