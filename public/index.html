<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truco Master Online - Royale</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Tela de Login / Lobby -->
  <div id="telaLobby" class="card-lobby">
    <div class="logo-container">
      <span class="naipe-icone">♠</span>
      <h1>TRUCO <span>ROYALE</span></h1>
      <span class="naipe-icone vermelho">♥</span>
    </div>
    <p class="subtitulo">Mesa Autoritativa & Multiplayer em Tempo Real</p>

    <div class="form-group">
      <label for="nomeJogador">Seu Apelido</label>
      <input type="text" id="nomeJogador" placeholder="Ex: MestreDoTruco" maxlength="12">
    </div>

    <div class="form-group">
      <label for="idSala">Código da Sala</label>
      <input type="text" id="idSala" placeholder="Ex: sala123" value="sala1">
    </div>

    <div class="form-group">
      <label for="maxJogadores">Modo de Jogo</label>
      <select id="maxJogadores">
        <option value="2">1 vs 1 (2 Jogadores)</option>
        <option value="4" selected>2 vs 2 (4 Jogadores)</option>
      </select>
    </div>

    <button class="btn-principal" onclick="entrarNaSala()">ENTRAR NA MESA</button>
  </div>

  <!-- Tela do Jogo (Mesa) -->
  <div id="telaJogo" class="oculto">
    
    <!-- Placar Principal -->
    <header class="placar-header">
      <div class="time-box time-azul">
        <span class="time-nome">ELES / TIME A</span>
        <span id="placarEles" class="time-pontos">0</span>
      </div>

      <div class="valendo-box">
        <span class="label">VALENDO</span>
        <span id="valorRodada" class="pontos-valor">1</span>
        <span class="label">PONTO(S)</span>
      </div>

      <div class="time-box time-vermelho">
        <span class="time-nome">NÓS / TIME B</span>
        <span id="placarNos" class="time-pontos">0</span>
      </div>
    </header>

    <!-- Status e Notificações -->
    <div id="statusMesa" class="status-banner">Aguardando jogadores entrarem...</div>

    <!-- Arena do Jogo -->
    <main class="arena">
      <!-- Vira e Baralho -->
      <div class="area-baralho">
        <div class="card-slot">
          <span class="slot-label">VIRA</span>
          <div id="cartaVira" class="carta-display vira-carta">?</div>
        </div>
      </div>

      <!-- Centro da Mesa (Cartas Jogadas) -->
      <div class="centro-mesa">
        <h3>MESA DE JOGO</h3>
        <div id="cartasNaMesa" class="grid-cartas-mesa"></div>
      </div>
    </main>

    <!-- Painel de Controles do Jogador -->
    <footer class="painel-jogador">
      <div class="acoes-truco">
        <button id="btnTruco" class="btn-truco" onclick="pedirTruco()">PEDIR TRUCO!</button>
      </div>

      <div class="minha-mao-container">
        <h3>SUAS CARTAS</h3>
        <div id="minhasCartas" class="mao-cards"></div>
      </div>
    </footer>

  </div>

  <script src="client.js"></script>
</body>
</html>
