<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truco Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="tela-login" class="card-login">
    <h2>Truco Online</h2>
    <input type="text" id="input-apelido" placeholder="Seu Apelido" maxlength="12">
    <input type="text" id="input-sala" placeholder="Nome da Sala">
    
    <div class="opcoes-criacao">
      <label>Jogadores na sala:</label>
      <select id="select-max-jogadores">
        <option value="2">2 Jogadores (1x1)</option>
        <option value="4" selected>4 Jogadores (2x2)</option>
      </select>
    </div>

    <div class="botoes-login">
      <button id="btn-entrar">Entrar na Sala</button>
      <button id="btn-criar">Criar Sala</button>
    </div>
  </div>

  <div id="tela-jogo" class="hidden">
    <div class="header-jogo">
      <div class="placar">
        <span id="placar-A">Nós: 0</span> | <span id="placar-B">Eles: 0</span>
        <div class="trofeus">
          <span id="trofeus-A">🏆 Nós: 0</span> | <span id="trofeus-B">🏆 Eles: 0</span>
        </div>
      </div>
      <div class="info-sala">
        <span id="label-sala"></span>
        <button id="btn-sair" class="btn-perigo">Sair</button>
      </div>
    </div>

    <!-- Tela/Overlay de Embaralhamento -->
    <div id="overlay-embaralhando" class="hidden">
      <div class="animacao-baralho">
        <div class="carta-embaralhar p1"></div>
        <div class="carta-embaralhar p2"></div>
        <div class="carta-embaralhar p3"></div>
      </div>
      <p>Embaralhando as cartas...</p>
    </div>

    <!-- Mesa Central -->
    <div class="mesa">
      <div class="area-vira-baralho">
        <!-- Monte / Baralho Fechado para esconder cartas -->
        <div id="monte-baralho" class="baralho-monte" title="Clique aqui para jogar a carta coberta (escondida)">
          <div class="verso-copag"></div>
        </div>
        
        <div class="vira-container">
          <label>VIRA</label>
          <div id="carta-vira" class="carta vira"></div>
        </div>
      </div>

      <!-- Area de clique para jogar a carta aberta -->
      <div id="area-jogada" class="area-jogada" title="Clique aqui para jogar a carta aberta">
        <div id="cartas-mesa" class="cartas-mesa"></div>
      </div>

      <div class="rodadas-indicador">
        <span>Rodadas:</span>
        <div id="historico-rodadas"></div>
      </div>
    </div>

    <div class="painel-status">
      <p id="status-vez">Aguardando início...</p>
      <p id="status-valor-mao">Valendo: 1 ponto</p>
    </div>

    <!-- Controles de Truco -->
    <div class="controles-truco">
      <button id="btn-truco">TRUCO!</button>
    </div>

    <!-- Modal para responder Truco -->
    <div id="modal-truco" class="modal hidden">
      <div class="modal-conteudo">
        <h3 id="texto-truco">Pediram Truco!</h3>
        <button id="btn-aceitar-truco" class="btn-sucesso">Aceitar</button>
        <button id="btn-aumentar-truco" class="btn-alerta">Aumentar</button>
        <button id="btn-correr-truco" class="btn-perigo">Correr</button>
      </div>
    </div>

    <!-- Cartas do Jogador -->
    <div class="area-minhas-cartas">
      <div id="minhas-cartas" class="cartas-container"></div>
      <p class="dica-jogada">Selecione uma carta e depois clique na <b>Mesa</b> (para jogar aberta) ou no <b>Baralho</b> (para jogar escondida).</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
